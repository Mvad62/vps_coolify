<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Змейка</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101820;
      color: #f3f6f4;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #1d3432, #101820 60%);
    }

    main {
      width: min(100%, 520px);
      text-align: center;
    }

    h1 { margin: 0 0 8px; font-size: clamp(2rem, 8vw, 3rem); }
    .hint { margin: 0 0 20px; color: #a7bbb5; }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #c9d8d2;
    }

    .score { font-size: 1.15rem; font-weight: 700; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #45655b;
      border-radius: 12px;
      background: #17251f;
      box-shadow: 0 18px 50px #0005;
      touch-action: none;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      color: #102019;
      background: #9de36d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #b6f18e; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .actions { margin-top: 16px; }
    .message { min-height: 1.5em; margin: 12px 0 0; color: #c9d8d2; }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      justify-content: center;
      gap: 7px;
      margin-top: 16px;
    }

    .controls button { padding: 10px 0; font-size: 1.2rem; }
    .controls button:first-child { grid-column: 2; }
    .controls button:nth-child(2) { grid-column: 1; }
    .controls button:nth-child(3) { grid-column: 2; }
    .controls button:nth-child(4) { grid-column: 3; }

    @media (min-width: 700px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Змейка</h1>
    <p class="hint">Собирай яблоки и не врезайся в себя.</p>
    <div class="scoreboard">
      <span>Счёт: <span class="score" id="score">0</span></span>
      <span>Рекорд: <span class="score" id="best">0</span></span>
    </div>
    <canvas id="game" width="480" height="480" aria-label="Игровое поле «Змейка»"></canvas>
    <div class="actions">
      <button id="restart" type="button">Начать игру</button>
    </div>
    <p class="message" id="message" aria-live="polite">Нажми «Начать игру» или любую стрелку.</p>
    <div class="controls" aria-label="Управление">
      <button type="button" data-direction="up" aria-label="Вверх">↑</button>
      <button type="button" data-direction="left" aria-label="Влево">←</button>
      <button type="button" data-direction="down" aria-label="Вниз">↓</button>
      <button type="button" data-direction="right" aria-label="Вправо">→</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const messageElement = document.getElementById("message");
    const restartButton = document.getElementById("restart");
    const cellSize = 24;
    const cellCount = canvas.width / cellSize;
    const directions = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const opposite = { up: "down", down: "up", left: "right", right: "left" };

    let snake;
    let direction;
    let nextDirection;
    let apple;
    let score;
    let timer;
    let running = false;
    let best = Number(localStorage.getItem("snake-best")) || 0;

    bestElement.textContent = best;

    function draw() {
      context.fillStyle = "#17251f";
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.strokeStyle = "#ffffff08";
      for (let i = 0; i <= cellCount; i += 1) {
        const position = i * cellSize;
        context.beginPath();
        context.moveTo(position, 0);
        context.lineTo(position, canvas.height);
        context.moveTo(0, position);
        context.lineTo(canvas.width, position);
        context.stroke();
      }

      context.fillStyle = "#ff6b5f";
      context.beginPath();
      context.arc(
        apple.x * cellSize + cellSize / 2,
        apple.y * cellSize + cellSize / 2,
        cellSize * 0.38,
        0,
        Math.PI * 2
      );
      context.fill();

      snake.forEach((segment, index) => {
        context.fillStyle = index === 0 ? "#b6f18e" : "#79c957";
        context.beginPath();
        context.roundRect(
          segment.x * cellSize + 2,
          segment.y * cellSize + 2,
          cellSize - 4,
          cellSize - 4,
          6
        );
        context.fill();
      });
    }

    function placeApple() {
      do {
        apple = {
          x: Math.floor(Math.random() * cellCount),
          y: Math.floor(Math.random() * cellCount)
        };
      } while (snake.some((segment) => segment.x === apple.x && segment.y === apple.y));
    }

    function startGame() {
      clearInterval(timer);
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = "right";
      nextDirection = "right";
      score = 0;
      running = true;
      scoreElement.textContent = score;
      messageElement.textContent = "Используй стрелки или WASD.";
      restartButton.textContent = "Начать заново";
      placeApple();
      draw();
      timer = setInterval(tick, 115);
    }

    function endGame() {
      running = false;
      clearInterval(timer);
      messageElement.textContent = `Игра окончена! Твой счёт: ${score}.`;
      restartButton.textContent = "Играть снова";
      if (score > best) {
        best = score;
        bestElement.textContent = best;
        localStorage.setItem("snake-best", best);
      }
    }

    function tick() {
      direction = nextDirection;
      const movement = directions[direction];
      const head = {
        x: snake[0].x + movement.x,
        y: snake[0].y + movement.y
      };
      const eatsApple = head.x === apple.x && head.y === apple.y;
      const bodyToCheck = eatsApple ? snake : snake.slice(0, -1);

      if (
        head.x < 0 || head.x >= cellCount ||
        head.y < 0 || head.y >= cellCount ||
        bodyToCheck.some((segment) => segment.x === head.x && segment.y === head.y)
      ) {
        endGame();
        return;
      }

      snake.unshift(head);
      if (eatsApple) {
        score += 1;
        scoreElement.textContent = score;
        placeApple();
      } else {
        snake.pop();
      }
      draw();
    }

    function changeDirection(newDirection) {
      if (!running) startGame();
      if (newDirection !== opposite[direction]) nextDirection = newDirection;
    }

    document.addEventListener("keydown", (event) => {
      const keyDirections = {
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down",
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right"
      };
      const newDirection = keyDirections[event.key];
      if (newDirection) {
        event.preventDefault();
        changeDirection(newDirection);
      }
    });

    document.querySelectorAll("[data-direction]").forEach((button) => {
      button.addEventListener("click", () => changeDirection(button.dataset.direction));
    });

    restartButton.addEventListener("click", startGame);
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    direction = "right";
    placeApple();
    draw();
  </script>
</body>
</html>
